
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mini BI Comercial - Oficial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
 --bg:#f5f7fb;--card:#fff;--green:#22c55e;--red:#ef4444;
 --yellow:#f59e0b;--blue:#3b82f6;--text:#1f2937;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial;background:var(--bg);color:var(--text)}
header{background:#fff;padding:14px 22px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.filters{display:flex;gap:12px;flex-wrap:wrap}
select{padding:8px 12px;border-radius:8px;border:1px solid #ddd}

main{padding:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card h4{margin:0;font-size:13px;color:#6b7280}
.card .value{font-size:26px;font-weight:700;margin-top:6px}
.card small{font-size:12px;color:#9ca3af}

.section{margin-top:28px}
.section h3{margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.progress{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:10px}
.progress div{height:100%}

.badge{float:right;padding:4px 8px;border-radius:8px;font-size:12px;color:#fff}
.green{background:var(--green)}.red{background:var(--red)}.yellow{background:var(--yellow)}

.layout-2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
canvas{width:100%!important;height:320px!important}
</style>
</head>

<body>
<header>
  <div class="filters">
    <select id="fMes"><option value="">Todos os meses</option></select>
    <select id="fVendedor"><option value="">Todos os vendedores</option></select>
  </div>
</header>

<main>

<div class="cards">
  <div class="card"><h4>Faturamento</h4><div class="value" id="fat"></div></div>
  <div class="card"><h4>Meta</h4><div class="value" id="meta"></div></div>
  <div class="card"><h4>Projeção</h4><div class="value" id="proj"></div></div>
  <div class="card"><h4>Atingimento</h4><div class="value" id="ating"></div></div>
</div>

<div class="section">
<h3>Segmentos</h3>
<div class="grid" id="segmentos"></div>
</div>

<div class="section">
<h3>Marcas</h3>
<div class="grid" id="marcas"></div>
</div>

<div class="section layout-2">
  <div class="card">
    <h3>Evolução Mensal</h3>
    <canvas id="chart"></canvas>
  </div>
</div>

</main>

<script>
let dados=[], chart;

fetch('dashboard_data_full.json').then(r=>r.json()).then(j=>{
  dados=j.records;

  const meses=[...new Set(dados.map(r=>r.MES))];
  const vendedores=[...new Set(dados.map(r=>r.VENDEDOR))];

  meses.forEach(m=>fMes.innerHTML+=`<option value="${m}">${m}</option>`);
  vendedores.forEach(v=>fVendedor.innerHTML+=`<option value="${v}">${v}</option>`);

  fMes.onchange=fVendedor.onchange=atualizar;
  atualizar();
});

function atualizar(){
  const m=fMes.value, v=fVendedor.value;
  const f=dados.filter(r=>(!m||r.MES==m)&&(!v||r.VENDEDOR==v));

  const fatTotal=f.reduce((s,r)=>s+(r.FATURAMENTO||0),0);
  fat.innerText='R$ '+fatTotal.toLocaleString('pt-BR');

  meta.innerText='—';
  proj.innerText='—';
  ating.innerText='—';

  const segMap={}, marcaMap={}, mesMap={};

  f.forEach(r=>{
    if(r.SEGMENTO){
      segMap[r.SEGMENTO]=(segMap[r.SEGMENTO]||0)+r.FATURAMENTO;
    }
    if(r.MARCA){
      marcaMap[r.MARCA]=(marcaMap[r.MARCA]||0)+r.FATURAMENTO;
    }
    if(r.MES){
      mesMap[r.MES]=(mesMap[r.MES]||0)+r.FATURAMENTO;
    }
  });

  segmentos.innerHTML='';
  Object.entries(segMap).forEach(([k,v])=>{
    segmentos.innerHTML+=`
    <div class="card">
      <h4>${k}</h4>
      <div class="value">R$ ${v.toLocaleString('pt-BR')}</div>
      <div class="progress"><div style="width:100%;background:var(--blue)"></div></div>
    </div>`;
  });

  marcas.innerHTML='';
  Object.entries(marcaMap).forEach(([k,v])=>{
    marcas.innerHTML+=`
    <div class="card">
      <h4>${k}</h4>
      <div class="value">R$ ${v.toLocaleString('pt-BR')}</div>
      <div class="progress"><div style="width:100%;background:var(--green)"></div></div>
    </div>`;
  });

  const labels=Object.keys(mesMap);
  const valores=Object.values(mesMap);

  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{labels:labels,datasets:[{label:'Faturamento',data:valores,backgroundColor:'#3b82f6'}]},
    options:{plugins:{legend:{display:false}}}
  });
}
</script>

</body>
</html>
